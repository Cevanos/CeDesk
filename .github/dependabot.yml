# Automatic upgrade PRs. Security fixes come as soon as an advisory is published
# (needs "Dependabot security updates" on in the repo's Settings > Code security);
# the weekly runs keep versions current so those fixes stay small.
version: 2
updates:
  # Python libraries (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates in one PR a week, not one PR per library.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # The Python base image in Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Stay on Python 3.12 until we move on purpose (CI and the code target 3.12).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The web app's npm packages (frontend/package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-and-next:
        patterns: ["react", "react-dom", "next", "eslint-config-next", "@types/react*"]
      tanstack:
        patterns: ["@tanstack/*"]
      testing:
        patterns:
          ["vitest", "@vitest/*", "@testing-library/*", "msw", "@playwright/*", "@axe-core/*"]
      lint-and-format:
        patterns: ["eslint*", "prettier*", "typescript-eslint", "husky", "lint-staged"]

  # The Node base image in frontend/Dockerfile
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
