# The backend (Python): lint, types, layers, tests and a library audit.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths-ignore: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
          POSTGRES_DB: cedesk
        ports: ["5447:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cedesk"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CEDESK_REQUIRE_DB: "1"
      PGPASSWORD: postgres_dev
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Create the database roles
        run: psql -h localhost -p 5447 -U postgres -d cedesk -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
      - run: uv sync --frozen
      # Fails the PR when any locked library (dev ones too) has a known vulnerability;
      # the output names the fixed version. Dependabot (.github/dependabot.yml) opens
      # the upgrade PRs.
      - name: Check libraries for known vulnerabilities
        run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt | uvx pip-audit==2.10.1 --disable-pip --no-deps -r /dev/stdin
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -q
