# The EC2 deploy files (deploy/ec2, .github/workflows/cd-ec2.yml) checked on GitHub's own
# runners, so a broken script, compose file or nginx config fails the pull request and not
# the release on the box.
name: Deploy files

on:
  push:
    branches: [main]
    paths: ["deploy/ec2/**", ".github/workflows/cd-ec2.yml", ".github/workflows/deploy-check.yml"]
  pull_request:
    paths: ["deploy/ec2/**", ".github/workflows/cd-ec2.yml", ".github/workflows/deploy-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts
        run: |
          shellcheck deploy/ec2/deploy.sh deploy/ec2/create-database.sh
          bash -n deploy/ec2/deploy.sh

      - name: The compose file parses with the example settings
        env:
          IMAGE_TAG: ci
        run: |
          docker compose --env-file deploy/ec2/env.example -f deploy/ec2/docker-compose.prod.yml config --quiet
          # Every slot and the worker too, with their profiles on.
          docker compose --env-file deploy/ec2/env.example -f deploy/ec2/docker-compose.prod.yml \
            --profile blue --profile green --profile tools config --services | sort | tr '\n' ' '

      - name: The web app's container gets no secret
        env:
          IMAGE_TAG: ci
        run: |
          out=$(docker compose --env-file deploy/ec2/env.example -f deploy/ec2/docker-compose.prod.yml \
            --profile blue --profile green config --format json)
          for svc in web-blue web-green; do
            for name in CEDESK_DATABASE_URL CEDESK_SECRET_KEY CEDESK_MIGRATION_DATABASE_URL CEDESK_SMTP_PASSWORD; do
              if jq -e --arg s "$svc" --arg n "$name" '.services[$s].environment | has($n)' <<<"$out" >/dev/null; then
                echo "::error::$svc is given $name"; exit 1
              fi
            done
          done
          # Only the migrate service may hold the owner login.
          for svc in api-blue api-green worker web-blue web-green; do
            if jq -e --arg s "$svc" '.services[$s].environment | has("CEDESK_MIGRATION_DATABASE_URL")' <<<"$out" >/dev/null; then
              echo "::error::$svc is given CEDESK_MIGRATION_DATABASE_URL"; exit 1
            fi
          done

      - name: The nginx site config is valid
        run: |
          mkdir nginx-test
          cat > nginx-test/nginx.conf <<'CONF'
          events {}
          http {
            upstream cedesk_api { server 127.0.0.1:8801; }
            upstream cedesk_web { server 127.0.0.1:8802; }
            include /etc/nginx/test-site.conf;
          }
          CONF
          docker run --rm \
            -v "$PWD/nginx-test/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/ec2/nginx/cedesk-site.conf.example:/etc/nginx/test-site.conf:ro" \
            nginx:1.27 nginx -t

      - name: The Parameter Store tool lints
        run: |
          pip install ruff==0.17.4
          ruff check deploy/ec2/env_ssm.py
          ruff format --check deploy/ec2/env_ssm.py
