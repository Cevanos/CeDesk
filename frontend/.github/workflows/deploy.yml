name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Where the app lives on the Contabo server (runner runs on that server).
  APP_DIR: /root/CDesk-frontend/CDesk-frontend
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "6543"

jobs:
  deploy:
    name: Deploy on self-hosted runner
    runs-on: [self-hosted, linux, contabo]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync code into app directory
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env*' \
            ./ "$APP_DIR"/

      - name: Install and build
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm run build

      - name: Restart app
        working-directory: ${{ env.APP_DIR }}
        run: |
          # First deploy starts the app; later deploys reload it.
          if pm2 describe cdesk-frontend >/dev/null 2>&1; then
            pm2 reload cdesk-frontend --update-env
          else
            pm2 start npm --name cdesk-frontend --update-env -- start
          fi
          pm2 save
