# CeDesk on one server: Postgres, a one-off migration, the API, and Caddy for HTTPS.
# Only Caddy is reachable from outside (80, 443); the database and the API are not.
# Usage (from this folder): cp env.example .env, fill it in, then `docker compose up -d --build`.
name: cedesk

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: cedesk
      CEDESK_OWNER_PASSWORD: ${CEDESK_OWNER_PASSWORD:?set CEDESK_OWNER_PASSWORD in deploy/.env}
      CEDESK_APP_PASSWORD: ${CEDESK_APP_PASSWORD:?set CEDESK_APP_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cedesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ..
    command: ["uv", "run", "--no-sync", "cedesk", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      CEDESK_ENV: ${CEDESK_ENV:-staging}
      CEDESK_MIGRATION_DATABASE_URL: postgresql+asyncpg://cedesk_owner:${CEDESK_OWNER_PASSWORD}@db:5432/cedesk

  api:
    build: ..
    restart: unless-stopped
    # Behind Caddy: take the client's address from X-Forwarded-For (Caddy replaces any
    # value the client sent), so the sign-in limit counts real addresses.
    command: ["uv", "run", "--no-sync", "uvicorn", "cedesk.main:app", "--host", "0.0.0.0",
              "--port", "8100", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CEDESK_ENV: ${CEDESK_ENV:-staging}
      CEDESK_DATABASE_URL: postgresql+asyncpg://cedesk_app:${CEDESK_APP_PASSWORD}@db:5432/cedesk
      CEDESK_SECRET_KEY: ${CEDESK_SECRET_KEY:?set CEDESK_SECRET_KEY in deploy/.env}
      CEDESK_CORS_ORIGINS: ${CEDESK_CORS_ORIGINS:-}
      CEDESK_APP_URL: ${CEDESK_APP_URL:-http://localhost:3000}
      CEDESK_MAIL_FROM_ADDRESS: ${CEDESK_MAIL_FROM_ADDRESS:-}
      CEDESK_INBOUND_EMAIL_TOKEN: ${CEDESK_INBOUND_EMAIL_TOKEN:-}
      # Settings > Email: where support addresses should forward to, and the mail
      # service's SPF name the DNS check looks for.
      CEDESK_MAIL_FORWARD_TO: ${CEDESK_MAIL_FORWARD_TO:-}
      CEDESK_MAIL_SPF_INCLUDE: ${CEDESK_MAIL_SPF_INCLUDE:-}
      # clamd: downloads wait until the worker found the file clean.
      CEDESK_SCAN_BACKEND: ${CEDESK_SCAN_BACKEND:-none}
      CEDESK_CEVANOS_URL: ${CEDESK_CEVANOS_URL:-https://api.cevanos.ai}
      CEDESK_STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - files:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ..
    restart: unless-stopped
    # Reads the support mailbox (IMAP), sends queued emails (with their files) and syncs
    # Cevanos chats. It has no port.
    command: ["uv", "run", "--no-sync", "cedesk", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CEDESK_ENV: ${CEDESK_ENV:-staging}
      CEDESK_DATABASE_URL: postgresql+asyncpg://cedesk_app:${CEDESK_APP_PASSWORD}@db:5432/cedesk
      CEDESK_SECRET_KEY: ${CEDESK_SECRET_KEY:?set CEDESK_SECRET_KEY in deploy/.env}
      # Links in the CSAT survey email open <portal url>/rate (empty: the app's address);
      # the survey's sender when a workspace has no support address.
      CEDESK_APP_URL: ${CEDESK_APP_URL:-http://localhost:3000}
      CEDESK_PORTAL_URL: ${CEDESK_PORTAL_URL:-}
      CEDESK_MAIL_FROM_ADDRESS: ${CEDESK_MAIL_FROM_ADDRESS:-}
      CEDESK_MAIL_BACKEND: ${CEDESK_MAIL_BACKEND:-log}
      CEDESK_SMTP_HOST: ${CEDESK_SMTP_HOST:-}
      CEDESK_SMTP_PORT: ${CEDESK_SMTP_PORT:-587}
      CEDESK_SMTP_SECURITY: ${CEDESK_SMTP_SECURITY:-starttls}
      CEDESK_SMTP_USERNAME: ${CEDESK_SMTP_USERNAME:-}
      CEDESK_SMTP_PASSWORD: ${CEDESK_SMTP_PASSWORD:-}
      CEDESK_IMAP_HOST: ${CEDESK_IMAP_HOST:-}
      CEDESK_IMAP_PORT: ${CEDESK_IMAP_PORT:-993}
      CEDESK_IMAP_USERNAME: ${CEDESK_IMAP_USERNAME:-}
      CEDESK_IMAP_PASSWORD: ${CEDESK_IMAP_PASSWORD:-}
      CEDESK_IMAP_FOLDER: ${CEDESK_IMAP_FOLDER:-INBOX}
      CEDESK_SCAN_BACKEND: ${CEDESK_SCAN_BACKEND:-none}
      CEDESK_CLAMD_HOST: ${CEDESK_CLAMD_HOST:-clamav}
      CEDESK_CLAMD_MAX_BYTES: ${CEDESK_CLAMD_MAX_BYTES:-104857600}
      # Cevanos: take-overs and replies out, customers' chat messages in.
      CEDESK_CEVANOS_URL: ${CEDESK_CEVANOS_URL:-https://api.cevanos.ai}
      # The same files as the api: replies send them, customer emails bring them.
      CEDESK_STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - files:/data/storage

  # Virus scan, off by default (it needs about 1.5 GB of memory). To use it:
  # `docker compose --profile scan up -d` and CEDESK_SCAN_BACKEND=clamd in deploy/.env.
  # The first start downloads the virus definitions (a few minutes); it updates them itself.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["scan"]
    volumes:
      - clamav:/var/lib/clamav

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      CEDESK_SITE: ${CEDESK_SITE:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  files:
  clamav:
  caddy_data:
  caddy_config:
