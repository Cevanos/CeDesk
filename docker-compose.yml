services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: cedesk
    ports:
      - "5447:5432"
    volumes:
      - cedesk-pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cedesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    profiles: ["api"]
    command: ["uv", "run", "--no-sync", "cedesk", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      CEDESK_MIGRATION_DATABASE_URL: postgresql+asyncpg://cedesk_owner:cedesk_owner_dev@db:5432/cedesk

  api:
    build: .
    profiles: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CEDESK_DATABASE_URL: postgresql+asyncpg://cedesk_app:cedesk_app_dev@db:5432/cedesk
    ports:
      - "8100:8100"

volumes:
  cedesk-pg:
